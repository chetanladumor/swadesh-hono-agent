services:
  - type: web
    name: swadesh-support-ai
    runtime: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: swadesh-db
          property: connectionString
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3-flash-preview

databases:
  - name: swadesh-db
    plan: free
    region: oregon
    databaseName: swadesh_support_db
    user: swadesh_admin
